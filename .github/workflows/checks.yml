name: Workbench checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run calculation and delivery checks
        run: python3 -m unittest discover -s tests -v
      - name: Run the example through both tools
        run: |
          python3 tools/quote.py examples/quote.json --output /tmp/quote-result.json
          python3 tools/check_deliverables.py /tmp/quote-result.json
